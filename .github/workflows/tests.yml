name: tests

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 依存ゼロ: テスト対象は stdlib のみのモジュールに限定してある
      # (state/io/goals/tile_map/path_memory/reward_state/dual_dev.gates)
      - name: Run unit tests
        run: python -m unittest discover -s generic_agent/tests -t . -v
