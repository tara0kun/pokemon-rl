name: tests

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 手元の poke-rl venv と同じ版。テストを回しているのはその環境なので CI も揃える
          python-version: "3.14"
      # テストが import 時に読む外部パッケージ (numpy / cv2 / anthropic) だけを入れる。
      # 依存ゼロのままだと battle_heal・party_grind などのテストが import で落ちて走らない。
      # mGBA・API キー・map_cache (gitignore) は不要。cache が要るテストは skip する
      - name: Install test dependencies
        run: pip install -r requirements-ci.txt
      - name: Run unit tests
        run: python -m unittest discover -s generic_agent/tests -t . -v
